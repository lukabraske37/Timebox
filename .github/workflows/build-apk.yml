name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    # Creating the release needs write access to the repository contents; the
    # default token is read-only and the release step fails with a 403.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The android/ folder is generated here, so no binary Gradle files live in git.
      - name: Scaffold the Android project
        # `flutter create` also restores its own template files, including a
        # counter-app test that calls MyApp() — a class this project does not
        # have. It fails to compile and takes the rest of the suite down with
        # it, so drop it again right away.
        run: |
          flutter create --platforms=android --org com.timebox --project-name timebox .
          rm -f test/widget_test.dart

      - name: Apply manifest permissions
        run: cp android_overrides/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Add the alarm sounds
        # Android plays an alarm's sound itself, out of the app's resources,
        # so the files the app previews from have to be there too: one set of
        # files in the repository, copied to where each side looks. The xml
        # beside them tells the provider in the manifest which folder of the
        # app's storage it may hand out — the one a sound picked by the user
        # is kept in.
        run: |
          res=android/app/src/main/res
          mkdir -p "$res/raw" "$res/xml"
          cp assets/sounds/*.ogg "$res/raw/"
          cp android_overrides/res/raw/*.xml "$res/raw/"
          cp android_overrides/res/xml/*.xml "$res/xml/"
          ls "$res/raw"

      - name: Let each plugin keep its own JVM target
        # Every plugin declares its own Java and Kotlin target — flutter_timezone
        # compiles Java at 11, share_plus at 17 — and Kotlin 2.x refuses to build
        # whenever the two sides of one module disagree. Pinning a single value
        # only moves the mismatch from one plugin to the next, so switch the
        # check off instead: D8 dexes every class file version they produce.
        run: echo 'kotlin.jvm.target.validation.mode=IGNORE' >> android/gradle.properties

      - name: Fetch Gradle from Gradle's own server
        # The wrapper the Flutter template writes points at GitHub's release
        # downloads, which answered 504 for a solid quarter of an hour on 8 Nov
        # and took three builds down with it. services.gradle.org serves the
        # same archive and is not the host everything else here already leans
        # on. Left alone if the template ever stops using GitHub.
        run: |
          f=android/gradle/wrapper/gradle-wrapper.properties
          sed -i -E 's#^distributionUrl=.*/gradle-distributions/releases/download/v?([0-9.]+)/gradle-([0-9.]+)-([a-z]+)\.zip#distributionUrl=https\\://services.gradle.org/distributions/gradle-\2-\3.zip#' "$f"
          grep distributionUrl "$f"

      - name: Compile every plugin against SDK 36
        # Plugins pin their own compileSdk — file_picker still sits on 34 — but
        # flutter_plugin_android_lifecycle now declares that everything using it
        # must compile against 36, so the older plugins fail their AAR metadata
        # check. Raising compileSdk changes only which APIs are on the compile
        # classpath; minSdk and targetSdk stay where they are.
        #
        # This has to run in afterEvaluate: a plugin sets its own compileSdk in
        # the body of its build.gradle, so anything applied while the plugin is
        # merely being loaded gets overwritten a moment later. Projects Flutter
        # has already evaluated by this point (:app) are skipped, since
        # afterEvaluate on them would throw.
        run: |
          cat >> android/build.gradle.kts <<'EOF'

          subprojects {
              if (!state.executed) {
                  afterEvaluate {
                      val androidExtension = extensions.findByName("android")
                      if (androidExtension is com.android.build.api.dsl.LibraryExtension) {
                          androidExtension.compileSdk = 36
                      }
                  }
              }
          }
          EOF

      - name: Raise minSdk to 23 (biometrics need it)
        run: |
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle || true

      - name: Enable core library desugaring (required by flutter_local_notifications)
        # The plugin schedules alarms with java.time, which only exists from API
        # 26 up, so it declares in its AAR metadata that the app must desugar the
        # JDK library. A second android {} block just reconfigures the same
        # extension, which keeps this independent of the generated file's layout.
        run: |
          cat >> android/app/build.gradle.kts <<'EOF'

          android {
              compileOptions {
                  isCoreLibraryDesugaringEnabled = true
              }
          }

          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
          }
          EOF

      - name: Keep the code the notification plugin needs
        # A release build is run through R8, which strips and renames classes
        # it thinks nothing uses. flutter_local_notifications stores every
        # scheduled alert through Gson, by reflection, so R8 cannot see the
        # use: scheduling then throws on the phone and no alert ever fires,
        # while everything looks fine in the app. The rules are the plugin's
        # own; shrinking is switched off as well, since a planner that cannot
        # ring is not worth the megabytes it saves.
        run: |
          cat > android/app/proguard-rules.pro <<'EOF'
          -keepattributes Signature
          -keepattributes *Annotation*
          -dontwarn sun.misc.**
          -keep class * extends com.google.gson.TypeAdapter
          -keep class * implements com.google.gson.TypeAdapterFactory
          -keep class * implements com.google.gson.JsonSerializer
          -keep class * implements com.google.gson.JsonDeserializer
          -keepclassmembers,allowobfuscation class * {
            @com.google.gson.annotations.SerializedName <fields>;
          }
          -keep,allowobfuscation,allowshrinking class com.google.gson.reflect.TypeToken
          -keep,allowobfuscation,allowshrinking class * extends com.google.gson.reflect.TypeToken
          -keep class com.dexterous.** { *; }
          EOF
          cat >> android/app/build.gradle.kts <<'EOF'

          android {
              buildTypes {
                  getByName("release") {
                      isMinifyEnabled = false
                      isShrinkResources = false
                  }
              }
          }
          EOF

      - name: Use a FlutterFragmentActivity (required by local_auth)
        run: |
          f=$(find android/app/src/main -name MainActivity.kt)
          cat > "$f" <<'EOF'
          package com.timebox.timebox

          import io.flutter.embedding.android.FlutterFragmentActivity

          class MainActivity : FlutterFragmentActivity()
          EOF

      - name: Sign with the project's own key, if there is one
        # Without this every build is signed with a debug key the runner makes
        # up on the spot, so no two releases share a signature and Android
        # refuses to install one over another: updating means uninstalling,
        # and uninstalling takes the user's data with it. With the keystore in
        # the SIGNING_KEYSTORE_B64 secret every release carries the same
        # signature and installs straight over the last.
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::No SIGNING_KEYSTORE_B64 secret, so this build is debug-signed and cannot update an installed copy."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/release.jks
          cat >> android/app/build.gradle.kts <<'EOF'

          android {
              signingConfigs {
                  create("timebox") {
                      storeFile = file("release.jks")
                      storePassword = System.getenv("KEYSTORE_PASSWORD")
                      keyAlias = "timebox"
                      keyPassword = System.getenv("KEYSTORE_PASSWORD")
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("timebox")
                  }
              }
          }
          EOF

      - run: flutter pub get

      # Build 11 shipped a shell whose navigation bar ate the whole screen, and
      # nothing in this workflow noticed. The layout tests fail on that, so run
      # them before spending five minutes on a broken APK.
      #
      # The runner's clock is UTC, where every day is 24 hours long. Half the
      # date arithmetic only goes wrong in a zone that changes its clocks, so
      # the tests are run in one.
      - run: flutter test
        env:
          TZ: Europe/Belgrade

      # Gradle pulls plugins, the Kotlin compiler and its own distribution over
      # the network on a cold runner, and any one of those can answer 504 for a
      # few minutes. Give the whole build three goes before calling it broken.
      - name: Build the APK
        # The run number becomes the version code, so each release is newer
        # than the last as far as Android is concerned.
        env:
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
        run: |
          for attempt in 1 2 3; do
            if flutter build apk --release \
                --build-number=${{ github.run_number }} \
                --dart-define=BUILD=${{ github.run_number }}; then exit 0; fi
            echo "::warning::APK build attempt $attempt failed, trying again"
            sleep $((attempt * 60))
          done
          exit 1

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: timebox-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Attach the APK to a release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Timebox build ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
