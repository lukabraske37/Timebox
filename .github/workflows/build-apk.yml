name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    # Creating the release needs write access to the repository contents; the
    # default token is read-only and the release step fails with a 403.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The android/ folder is generated here, so no binary Gradle files live in git.
      - name: Scaffold the Android project
        # `flutter create` also restores its own template files, including a
        # counter-app test that calls MyApp() — a class this project does not
        # have. It fails to compile and takes the rest of the suite down with
        # it, so drop it again right away.
        run: |
          flutter create --platforms=android --org com.timebox --project-name timebox .
          rm -f test/widget_test.dart

      - name: Apply manifest permissions
        run: cp android_overrides/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Let each plugin keep its own JVM target
        # Every plugin declares its own Java and Kotlin target — flutter_timezone
        # compiles Java at 11, share_plus at 17 — and Kotlin 2.x refuses to build
        # whenever the two sides of one module disagree. Pinning a single value
        # only moves the mismatch from one plugin to the next, so switch the
        # check off instead: D8 dexes every class file version they produce.
        run: echo 'kotlin.jvm.target.validation.mode=IGNORE' >> android/gradle.properties

      - name: Compile every plugin against SDK 36
        # Plugins pin their own compileSdk — file_picker still sits on 34 — but
        # flutter_plugin_android_lifecycle now declares that everything using it
        # must compile against 36, so the older plugins fail their AAR metadata
        # check. Raising compileSdk changes only which APIs are on the compile
        # classpath; minSdk and targetSdk stay where they are.
        #
        # This has to run in afterEvaluate: a plugin sets its own compileSdk in
        # the body of its build.gradle, so anything applied while the plugin is
        # merely being loaded gets overwritten a moment later. Projects Flutter
        # has already evaluated by this point (:app) are skipped, since
        # afterEvaluate on them would throw.
        run: |
          cat >> android/build.gradle.kts <<'EOF'

          subprojects {
              if (!state.executed) {
                  afterEvaluate {
                      val androidExtension = extensions.findByName("android")
                      if (androidExtension is com.android.build.api.dsl.LibraryExtension) {
                          androidExtension.compileSdk = 36
                      }
                  }
              }
          }
          EOF

      - name: Raise minSdk to 23 (biometrics need it)
        run: |
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle || true

      - name: Enable core library desugaring (required by flutter_local_notifications)
        # The plugin schedules alarms with java.time, which only exists from API
        # 26 up, so it declares in its AAR metadata that the app must desugar the
        # JDK library. A second android {} block just reconfigures the same
        # extension, which keeps this independent of the generated file's layout.
        run: |
          cat >> android/app/build.gradle.kts <<'EOF'

          android {
              compileOptions {
                  isCoreLibraryDesugaringEnabled = true
              }
          }

          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
          }
          EOF

      - name: Use a FlutterFragmentActivity (required by local_auth)
        run: |
          f=$(find android/app/src/main -name MainActivity.kt)
          cat > "$f" <<'EOF'
          package com.timebox.timebox

          import io.flutter.embedding.android.FlutterFragmentActivity

          class MainActivity : FlutterFragmentActivity()
          EOF

      - run: flutter pub get

      # Build 11 shipped a shell whose navigation bar ate the whole screen, and
      # nothing in this workflow noticed. The layout tests fail on that, so run
      # them before spending five minutes on a broken APK.
      - run: flutter test

      - run: flutter build apk --release

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: timebox-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Attach the APK to a release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Timebox build ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
