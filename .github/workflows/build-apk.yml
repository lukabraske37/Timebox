name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The android/ folder is generated here, so no binary Gradle files live in git.
      - name: Scaffold the Android project
        run: flutter create --platforms=android --org com.timebox --project-name timebox .

      - name: Apply manifest permissions
        run: cp android_overrides/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Align Kotlin JVM target across all plugin subprojects
        # Some plugins (e.g. flutter_timezone) still compile Kotlin against
        # JVM target 1.8 while Flutter's generated build compiles Java
        # against 11, which Gradle rejects as "Inconsistent JVM Target
        # Compatibility". Force every subproject's Kotlin tasks to match.
        run: |
          cat >> android/build.gradle.kts <<'EOF'

          subprojects {
              tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
                  compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11)
              }
          }
          EOF

      - name: Raise minSdk to 23 (biometrics need it)
        run: |
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle || true

      - name: Use a FlutterFragmentActivity (required by local_auth)
        run: |
          f=$(find android/app/src/main -name MainActivity.kt)
          cat > "$f" <<'EOF'
          package com.timebox.timebox

          import io.flutter.embedding.android.FlutterFragmentActivity

          class MainActivity : FlutterFragmentActivity()
          EOF

      - run: flutter pub get
      - run: flutter build apk --release

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: timebox-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Attach the APK to a release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Timebox build ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
